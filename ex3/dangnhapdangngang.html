<!DOCTYPE html>
<html lang="vi">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Trang đăng nhập</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <form class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card border-1 border-info-subtle">
                        <div class="card-header text-primary border-bottom border-info-subtle bg-info-subtle">
                            Biểu mẫu đăng nhập
                        </div>
                        <div class="card-body bg-white">
                            <div class="row">
                                <label for="email" class="col-sm-3 col-form-label fw-bold text-end pe-4">Email:</label>
                                <div class="col-sm-7">
                                    <input type="email" class="form-control" id="email" placeholder="Nhập vào email">
                                </div>
                            </div>
                            <div class="mt-3 row">
                                <label for="password" class="col-sm-3 col-form-label fw-bold text-end pe-4 text-nowrap">Mật khẩu:</label>
                                <div class="col-sm-7">
                                    <input type="password" class="form-control" id="password"
                                        placeholder="Nhập vào mật khẩu">
                                </div>
                            </div>
                            <div class="mt-4 row">
                                <div class="col-sm-8 offset-sm-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">Ghi nhớ tôi</label>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3 mb-3 row">
                                <div class="col-sm-8 offset-sm-3">
                                    <button type="submit" class="btn btn-primary">Đăng nhập</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </body>

</html>
