<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập dạng đứng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="col-md-5 mx-auto">
    <div class="card border-1 border-info-subtle">
        <div class="card-header border-bottom border-info-subtle text-primary bg-info-subtle">
            Biểu mẫu đăng nhập
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email:</label>
                <input type="email" class="form-control"
                       id="email" placeholder="Nhập vào email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-bold">Password:</label>
                <input type="password" class="form-control"
                       id="password" placeholder="Nhập vào mật khẩu">
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">
                    Ghi nhớ tôi
                </label>
            </div>
            <button type="submit" class="btn btn-primary">
                Đăng nhập
            </button>
        </div>
    </div>
    </div>
</div>
</body>
</html>
