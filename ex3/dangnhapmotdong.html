<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập 1 dòng</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="col-md-10 mx-auto">
        <div class="card border-1 rounded-0">
            <div class="card-header bg-primary rounded-0 text-white">Biểu mẫu đăng nhập</div>
        <div class="card-body pt-4">
            <div class="row align-items-center justify-content-center gx-3">
            <div class="col-2"></div>
            <div class="col-3">
                <div class="input-group">
                    <span class="input-group-text border border-secondary-subtle bg-secondary-subtle">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="email" class="form-control" id="email" placeholder="Nhập vào email">
                </div>
            </div>
            <div class="col-3">
                <div class="input-group">
                    <span class="input-group-text border border-secondary-subtle bg-secondary-subtle">
                        <i class="fas fa-lock"></i>
                    </span>
                <input type="password" class="form-control" id="password" placeholder="Nhập vào mật khẩu">
                </div>
            </div>
            <div class="col-2">
                <div class="input-group">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Ghi nhớ tôi</label>
                    </div>
                </div>
            </div>
            <div class="col-2">
                <div class="input-group">
                    <button type="submit" class="btn btn-primary">Đăng nhập</button>
                </div>
            </div>
        </div>
        </div>
    </div>
    </div>
    </div>
</body>
</html>
